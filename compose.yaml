services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - catalogue-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  catalogue-data:
    name: catalogue-data
