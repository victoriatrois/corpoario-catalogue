quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:catalogue}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogue}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:database/migration
